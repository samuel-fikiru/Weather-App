<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="body-container">
        <div class="full-stat-container">
            <p class="page-title">Weather App</p>
            <div class="form-container">
                <input class="place-input" placeholder="write a place" type="text">
                <button class="btn">Get Weather</button>
            </div>
            <div class="weather-data">
                <p>New York</p>
                <p>Clear Sky</p>
                <p>Temperature : <span>19.25</span>C</p>
                <p>Humidity : <span>89</span>%</p>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
