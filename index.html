<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="body-container">
        <div class="full-stat-container">
            <p class="page-title">Weather App</p>
            <div class="form-container">
                <input class="input-bar js-input-bar" placeholder="Write a place" type="text">
                <button class="btn js-btn">Get Weather</button>
            </div>
            <div class="weather-data">
                <p class="place-name js-place-name">New York</p>
                <p class="weather-stat js-weather-stat">Clear Sky</p>
                <p class="temp">Temperature : <span class="js-temp">19.25</span>&deg;C</p>
                <p class="humidity">Humidity : <span class=" js-humidity">89</span>%</p>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
