<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="full-stat-container">
      <p class="page-title">Weather App</p>
      <div class="form-container">
        <input class="input-bar js-input-bar" placeholder="Write your location" type="text" />
        <button class="btn js-btn">Get Weather</button>
      </div>
      <div class="weather-data">
        <p class="place-name js-place-name"></p>
        <p class="weather-stat js-weather-stat"></p>
        <p class="temp js-temp"></p>
        <p class="humidity js-humidity"></p>
        <p class="error-mesg">Invalid Location,<br> <span class="request-text">please type valid location</span> </p>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
